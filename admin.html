<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Admin | NAYA INDIA ESPORTS</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#05070d;--panel:#0b1220;--line:#16233d;--neon:#00d4ff;--blue:#2f6bff;--text:#e6f1ff;--mut:#7f8fae;--ok:#22e58f;--bad:#ff4d6d;--warn:#ffb020}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.5 Inter,system-ui,sans-serif;min-height:100vh}
a{color:var(--neon);text-decoration:none}
h1,h2,h3,.logo{font-family:Rajdhani,Inter,sans-serif;letter-spacing:.5px}
h1{font-size:28px;margin-bottom:14px}h2{font-size:21px;margin:20px 0 10px}h3{font-size:17px}
.top{position:sticky;top:0;z-index:20;background:rgba(5,7,13,.96);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:10px 14px}
.logo{font-size:20px;font-weight:700}.logo b{color:var(--neon)}
#burger{background:none;border:1px solid var(--line);color:var(--text);font-size:20px;border-radius:8px;padding:2px 10px;display:none}
#who{margin-left:auto;color:var(--mut);font-size:13px}
.wrap{display:flex}
#side{width:220px;flex:none;border-right:1px solid var(--line);padding:12px;min-height:calc(100vh - 53px)}
#side a{display:block;color:var(--text);padding:8px 10px;border-radius:8px;margin-bottom:2px}
#side a:hover,#side a.on{background:#0f1c33;color:var(--neon)}
main{flex:1;min-width:0;padding:18px 14px 40px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.stats{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));margin-bottom:14px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;text-align:center}
.stat b{display:block;font:700 24px Rajdhani;color:var(--neon)}
.muted{color:var(--mut);font-size:13px}
.btn{display:inline-block;background:linear-gradient(90deg,var(--blue),var(--neon));color:#001018;border:0;border-radius:8px;padding:7px 13px;font:600 13px Inter;cursor:pointer;margin:3px 3px 0 0}
.btn.ghost{background:none;border:1px solid var(--neon);color:var(--neon)}
.btn.red{background:var(--bad);color:#fff}.btn.green{background:var(--ok)}
.btn:disabled{opacity:.5;cursor:not-allowed}
input,select,textarea{width:100%;background:#08101d;border:1px solid var(--line);color:var(--text);border-radius:8px;padding:9px;font:inherit;margin:4px 0 10px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--neon);border-color:transparent}
td input{margin:0;padding:6px;min-width:60px}
label{font-size:13px;color:var(--mut)}
.cols{display:grid;gap:0 12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.badge{display:inline-block;font-size:12px;padding:2px 10px;border-radius:20px;border:1px solid var(--mut);text-transform:capitalize}
.badge.live,.badge.approved,.badge.paid{border-color:var(--ok);color:var(--ok)}
.badge.upcoming,.badge.pending{border-color:var(--warn);color:var(--warn)}
.badge.rejected,.badge.banned{border-color:var(--bad);color:var(--bad)}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:520px}
th,td{padding:8px;border-bottom:1px solid var(--line);text-align:left;font-size:13.5px;vertical-align:middle}th{color:var(--mut);font-weight:500}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#0f2a4d;border:1px solid var(--neon);padding:10px 18px;border-radius:10px;opacity:0;pointer-events:none;transition:.25s;z-index:50;max-width:90%}
#toast.show{opacity:1}#toast.err{border-color:var(--bad);background:#3a0f1a}
.warn{background:#3a2a05;border-bottom:1px solid var(--warn);color:var(--warn);padding:8px 14px;text-align:center}
.loader{text-align:center;color:var(--mut);padding:40px}
#gate{max-width:380px;margin:60px auto;padding:0 14px}
@media(max-width:800px){#burger{display:block}#side{display:none;position:fixed;top:53px;left:0;bottom:0;background:var(--bg);z-index:15;overflow-y:auto}#side.open{display:block}}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px;padding-bottom:4px}.tabs button{white-space:nowrap;background:var(--panel);border:1px solid var(--line);color:var(--text);padding:7px 14px;border-radius:20px;cursor:pointer;font:500 13px Inter}.tabs .on{border-color:var(--neon);color:var(--neon)}

/* ===== THEME V2 : gaming look (same as website) ===== */
:root{--bg:#04060c;--panel:#0b1324;--line:#1a2b4d;--neon:#18e0ff;--blue:#4d7cff;--gold:#ffc83d;--text:#eaf3ff;--mut:#8497ba}
body{background:radial-gradient(1100px 560px at 85% -8%,rgba(77,124,255,.24),transparent 60%),radial-gradient(800px 480px at -10% 8%,rgba(24,224,255,.14),transparent 55%),var(--bg);background-attachment:fixed}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;background-image:linear-gradient(rgba(255,255,255,.028) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.028) 1px,transparent 1px);background-size:38px 38px;-webkit-mask-image:radial-gradient(circle at 50% 0,#000 0,transparent 75%);mask-image:radial-gradient(circle at 50% 0,#000 0,transparent 75%)}
h1{font-size:30px;text-transform:uppercase;letter-spacing:1.5px;background:linear-gradient(90deg,#fff,var(--neon));-webkit-background-clip:text;background-clip:text;color:transparent}
#app>h2{text-transform:uppercase;letter-spacing:1px;display:flex;align-items:center;gap:10px;margin:24px 0 12px}
#app>h2::before{content:"";width:5px;height:22px;border-radius:3px;background:linear-gradient(var(--neon),var(--blue));box-shadow:0 0 12px var(--neon)}
.top{background:rgba(4,6,12,.8);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.logo{letter-spacing:1.5px}.logo b{text-shadow:0 0 16px var(--neon)}
#side{background:rgba(9,16,32,.6)}
#side a{transition:.2s}#side a.on{background:linear-gradient(135deg,rgba(77,124,255,.32),rgba(24,224,255,.18));box-shadow:inset 0 0 0 1px rgba(24,224,255,.35)}
.card{background:linear-gradient(160deg,rgba(20,34,64,.88),rgba(9,16,32,.92));border-radius:16px;box-shadow:0 8px 30px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.05)}
.btn{background:linear-gradient(90deg,var(--blue),var(--neon));border-radius:9px;font-weight:700;letter-spacing:.4px;box-shadow:0 4px 16px rgba(24,224,255,.22);transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(24,224,255,.38)}.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;box-shadow:none}.btn.red{background:linear-gradient(90deg,#ff4d6d,#ff3d81)}.btn.green{background:linear-gradient(90deg,#1fd18a,#22e58f);color:#00210f}
input,select,textarea{border-radius:10px;background:#07101f}input:focus,select:focus,textarea:focus{outline:none;border-color:var(--neon);box-shadow:0 0 0 3px rgba(24,224,255,.18)}
.stat{background:linear-gradient(160deg,#0e1b36,#08101f);border-radius:14px}.stat b{font-size:26px;text-shadow:0 0 14px rgba(24,224,255,.45)}
.tabs button.on{background:linear-gradient(90deg,var(--blue),var(--neon));color:#001018;border-color:transparent;font-weight:700}
th{text-transform:uppercase;font-size:11px;letter-spacing:.8px}tr:hover td{background:rgba(24,224,255,.045)}
.badge{font-weight:600}.badge.live{border-color:#ff4d6d;color:#ff4d6d}.badge.live::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#ff4d6d;margin-right:6px;animation:pulse 1.2s infinite}
.brand{text-align:center;margin:10px 0 18px}.brand .lg{font:700 40px/1 Rajdhani;letter-spacing:2px}.brand .lg b{color:var(--neon);text-shadow:0 0 22px var(--neon)}.brand p{margin-top:8px}
.loader{font-size:0}.loader::before{content:"";display:block;width:40px;height:40px;margin:0 auto 10px;border:3px solid var(--line);border-top-color:var(--neon);border-radius:50%;animation:spin .8s linear infinite}.loader::after{content:"Loading…";font-size:13px}
#app>*{animation:rise .4s both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{50%{opacity:.25}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="cfgwarn"></div>
<div id="gate"><div class="brand"><div class="lg">NAYA <b>ADMIN</b></div><p class="muted">Control room for NAYA INDIA ESPORTS</p></div><div class="card"><h1>Admin login</h1><form data-f="alogin"><label>Admin email</label><input name="email" type="email" required><label>Password</label><input name="password" type="password" required><button class="btn" type="submit">Login</button></form><p class="muted" id="gmsg"></p></div></div>
<div id="shell" style="display:none">
<header class="top"><button id="burger" aria-label="Menu">☰</button><span class="logo">NAYA <b>ADMIN</b></span><span id="who"></span><button class="btn ghost" data-a="logout">Logout</button></header>
<div class="wrap"><nav id="side"></nav><main id="app"></main></div>
</div>
<div id="toast"></div>

<script type="text/plain" id="mainjs">
/* ====== PASTE THE SAME FIREBASE WEB CONFIG AS index.html ====== */
const CFG={apiKey:"AIzaSyCUOHKfHy35G4M3pUxWHerEWxPQ-zYvyg8",authDomain:"naya-india-esportsa.firebaseapp.com",projectId:"naya-india-esportsa",storageBucket:"naya-india-esportsa.firebasestorage.app",messagingSenderId:"541751208129",appId:"1:541751208129:web:973af506812cfe23d14c40"};
/* =============================================================== */
if(CFG.apiKey.startsWith('PASTE')){document.getElementById('cfgwarn').innerHTML='<div class="warn">Firebase config missing: CFG (apiKey, appId) paste karo.</div>'}
firebase.initializeApp(CFG);
const auth=firebase.auth(),db=firebase.firestore(),FV=firebase.firestore.FieldValue;
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=ms=>ms?new Date(ms).toLocaleString('en-IN',{dateStyle:'medium',timeStyle:'short'}):'-';
const rs=n=>'₹'+Number(n||0).toLocaleString('en-IN');
const fd=f=>Object.fromEntries(new FormData(f));
const docs=s=>s.docs.map(d=>({id:d.id,...d.data()}));
const DEF_GAMES=[{name:'BGMI',icon:'🔫',desc:'Battlegrounds Mobile India'},{name:'Free Fire MAX',icon:'🔥',desc:'Battle royale'},{name:'Valorant',icon:'🎯',desc:'5v5 tactical shooter'},{name:'Call of Duty Mobile',icon:'💥',desc:'CODM BR and MP'},{name:'Other Games',icon:'🎮',desc:'More games'}];
const H={},ACT={},CH={},R={};
let ready=false,user=null,admin=null,TL=[],GL=[],UL=[],RG=[],WD=[],MS=[],RES={},rt='',rf='all',st='';
function toast(m,e){const t=$('#toast');t.textContent=m;t.className='show'+(e?' err':'');clearTimeout(toast.t);toast.t=setTimeout(()=>t.className='',3500)}
function busy(f,on){f.querySelectorAll('button[type=submit]').forEach(b=>b.disabled=on)}
function fe(e){const m={'auth/invalid-credential':'Wrong email or password','auth/wrong-password':'Wrong email or password','auth/user-not-found':'Wrong email or password','auth/invalid-email':'Invalid email','auth/too-many-requests':'Too many attempts. Try later','auth/network-request-failed':'No internet connection','permission-denied':'Permission denied. Check Firestore rules and your admin role','failed-precondition':'Firestore index needed - open browser console and click the link'};return m[e.code]||e.message||'Something went wrong'}
function tbl(h,rows){if(!rows.length)return '<div class="card muted">No data yet.</div>';return `<div class="card tw"><table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</table></div>`}
const notify=(uid,title,body)=>db.collection('notifications').add({uid,title,body,createdAt:Date.now()});
const toLocal=ms=>{if(!ms)return '';const d=new Date(ms-new Date().getTimezoneOffset()*60000);return d.toISOString().slice(0,16)};
async function loadTL(){TL=docs(await db.collection('tournaments').orderBy('startTime','desc').limit(200).get())}
async function loadGL(){GL=docs(await db.collection('games').get());return GL}
const tsel=(id,v,all)=>`<select ${id}>${all?'<option value="">All tournaments</option>':'<option value="">Select tournament</option>'}${TL.map(t=>`<option value="${t.id}" ${t.id===v?'selected':''}>${esc(t.title)} (${esc(t.status)})</option>`).join('')}</select>`;

/* ---------- auth gate ---------- */
const NAV=[['dash','📊 Dashboard Overview'],['users','👥 Manage Users'],['games','🎮 Manage Games'],['create','🏆 Create Tournament'],['regs','📝 Manage Registrations'],['deposits','💳 Manage Deposits'],['coins','🪙 Coin Management'],['matches','⚔️ Manage Matches'],['results','🥇 Update Results'],['prizes','💰 Manage Prizes'],['news','📰 Manage News'],['reports','📈 Reports & Analytics'],['settings','⚙️ Site Settings']];
$('#burger').onclick=()=>$('#side').classList.toggle('open');
document.addEventListener('submit',e=>{const h=H[e.target.dataset.f];if(h){e.preventDefault();h(e.target)}});
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&ACT[b.dataset.a]){e.preventDefault();ACT[b.dataset.a](b.dataset,b)}});
document.addEventListener('change',e=>{const c=e.target.dataset.c;if(c&&CH[c])CH[c](e.target.value)});
document.addEventListener('input',e=>{const c=e.target.dataset.i;if(c&&CH[c])CH[c](e.target.value)});
H.alogin=async f=>{const v=fd(f);$('#gmsg').textContent='Logging in…';busy(f,true);try{await auth.signInWithEmailAndPassword(v.email.trim(),v.password)}catch(e){$('#gmsg').textContent=fe(e);$('#gmsg').style.cssText='color:#ff4d6d;font-size:14px';toast(fe(e),1)}busy(f,false)};
ACT.logout=()=>auth.signOut();
auth.onAuthStateChanged(async u=>{user=u;admin=null;if(u){let why='';try{const d=await db.collection('users').doc(u.uid).get();if(!d.exists)why='Is login ka profile (users document) Firestore me nahi mila.';else if(d.data().banned)why='Ye account banned hai.';else if(d.data().role!=='admin')why='Ye account admin nahi hai. Firestore me users > aapka document > role = admin (chhote akshar) karo.';else admin=d.data()}catch(e){console.error(e);why='Firestore ne access roke diya ('+(e.code||e.message)+'). Firestore Rules publish karo.'}if(!admin){$('#gmsg').textContent='Access denied: '+why;$('#gmsg').style.cssText='color:#ff4d6d;font-size:14px';await auth.signOut();return}}
ready=true;$('#gate').style.display=admin?'none':'block';$('#shell').style.display=admin?'block':'none';if(admin){$('#who').textContent=admin.name+' (admin)';route()}});

/* ---------- router ---------- */
async function route(){if(!ready||!admin)return;const p=location.hash.replace(/^#\/?/,'')||'dash';$('#side').innerHTML=NAV.map(([k,l])=>`<a class="${p===k?'on':''}" href="#/${k}">${l}</a>`).join('');$('#side').classList.remove('open');app.innerHTML='<div class="loader">Loading…</div>';try{await(R[p]||R.dash)()}catch(e){console.error(e);app.innerHTML=`<div class="card"><h2>Error</h2><p class="muted">${esc(fe(e))}</p><button class="btn" onclick="route()">Retry</button></div>`}window.scrollTo(0,0)}
window.addEventListener('hashchange',route);

/* ---------- dashboard ---------- */
R.dash=async()=>{const q=n=>db.collection(n).limit(1000).get();const [u,t,r,w,m]=await Promise.all([q('users'),q('tournaments'),q('registrations'),q('withdrawals'),q('matches')]);const T=docs(t),RGs=docs(r),W=docs(w);
const rev=RGs.filter(x=>x.status==='approved').reduce((s,x)=>s+(x.amount||0),0);
app.innerHTML=`<h1>Dashboard Overview</h1><div class="stats"><div class="stat"><b>${u.size}</b>Users</div><div class="stat"><b>${T.length}</b>Tournaments</div><div class="stat"><b>${T.filter(x=>x.status==='live').length}</b>Live</div><div class="stat"><b>${T.filter(x=>x.status==='upcoming').length}</b>Upcoming</div><div class="stat"><b>${RGs.filter(x=>x.status==='pending').length}</b>Pending registrations</div><div class="stat"><b>${W.filter(x=>x.status==='pending').length}</b>Pending withdrawals</div><div class="stat"><b>${rs(rev)}</b>Entry revenue</div><div class="stat"><b>${m.size}</b>Matches</div></div><div class="card"><a class="btn" href="#/create">Create tournament</a><a class="btn ghost" href="#/regs">Review registrations</a><a class="btn ghost" href="#/prizes">Withdrawals</a></div>`};

/* ---------- users ---------- */
R.users=async()=>{UL=docs(await db.collection('users').orderBy('createdAt','desc').limit(500).get());st='';drawUsers()};
function drawUsers(){const q=st.toLowerCase();const l=UL.filter(u=>[u.name,u.email,u.username,u.phone].join(' ').toLowerCase().includes(q));app.innerHTML=`<h1>Manage Users</h1><input data-i="usearch" placeholder="Search name, email, username, phone" value="${esc(st)}" id="usearch"><div id="ulist">${utbl(l)}</div>`}
function utbl(l){return tbl(['User','Contact','Coins','Role','Status','Actions'],l.map(u=>[`<b>${esc(u.name)}</b><br><span class="muted">@${esc(u.username)}</span>`,`${esc(u.email)}<br><span class="muted">${esc(u.phone)}</span>`,`🟡 ${u.gold||0} / 🔵 ${u.wallet||0}`,esc(u.role),u.banned?'<span class="badge banned">banned</span>':'<span class="badge approved">active</span>',u.id===user.uid?'<span class="muted">You</span>':`<button class="btn ${u.banned?'green':'red'}" data-a="uban" data-id="${u.id}">${u.banned?'Unban':'Ban'}</button><button class="btn ghost" data-a="urole" data-id="${u.id}">${u.role==='admin'?'Remove admin':'Make admin'}</button>`]))}
CH.usearch=v=>{st=v;const q=v.toLowerCase();$('#ulist').innerHTML=utbl(UL.filter(u=>[u.name,u.email,u.username,u.phone].join(' ').toLowerCase().includes(q)))};
ACT.uban=async d=>{const u=UL.find(x=>x.id===d.id);try{await db.collection('users').doc(u.id).update({banned:!u.banned});u.banned=!u.banned;toast(u.banned?'User banned':'User unbanned');CH.usearch(st)}catch(e){toast(fe(e),1)}};
ACT.urole=async d=>{const u=UL.find(x=>x.id===d.id),nr=u.role==='admin'?'player':'admin';if(!confirm(`Change ${u.name} to ${nr}?`))return;try{await db.collection('users').doc(u.id).update({role:nr});u.role=nr;toast('Role updated');CH.usearch(st)}catch(e){toast(fe(e),1)}};
ACT.uwal=async d=>{const u=UL.find(x=>x.id===d.id),a=Number(prompt(`Add (+) or remove (-) wallet amount for ${u.name}. Current ${u.wallet||0}`));if(!a||isNaN(a))return;if((u.wallet||0)+a<0)return toast('Wallet cannot go below 0',1);try{const b=db.batch();b.update(db.collection('users').doc(u.id),{wallet:FV.increment(a)});b.set(db.collection('transactions').doc(),{uid:u.id,type:'adjust',amount:a,note:'Admin adjustment',createdAt:Date.now()});await b.commit();u.wallet=(u.wallet||0)+a;toast('Wallet updated');CH.usearch(st)}catch(e){toast(fe(e),1)}};

/* ---------- games ---------- */
R.games=async()=>{await loadGL();app.innerHTML=`<h1>Manage Games</h1><div class="card"><form data-f="gsave"><div class="cols"><div><label>Game name</label><input name="name" required maxlength="30"></div><div><label>Icon (emoji)</label><input name="icon" maxlength="4" value="🎮"></div></div><label>Description</label><input name="desc" maxlength="120"><button class="btn" type="submit">Add game</button>${GL.length?'':'<button class="btn ghost" type="button" data-a="gdef">Load default games</button>'}</form></div>${tbl(['Icon','Game','Description','Actions'],GL.map(g=>[esc(g.icon),esc(g.name),esc(g.desc),`<button class="btn red" data-a="gdel" data-id="${g.id}">Delete</button>`]))}`};
H.gsave=async f=>{const v=fd(f);busy(f,true);try{await db.collection('games').add({name:v.name.trim(),icon:v.icon.trim()||'🎮',desc:v.desc.trim(),active:true,createdAt:Date.now()});toast('Game added');route()}catch(e){toast(fe(e),1);busy(f,false)}};
ACT.gdef=async()=>{try{const b=db.batch();DEF_GAMES.forEach(g=>b.set(db.collection('games').doc(),{...g,active:true,createdAt:Date.now()}));await b.commit();toast('Default games added');route()}catch(e){toast(fe(e),1)}};
ACT.gdel=async d=>{if(!confirm('Delete this game?'))return;try{await db.collection('games').doc(d.id).delete();toast('Game deleted');route()}catch(e){toast(fe(e),1)}};

/* ---------- create / manage tournaments ---------- */
R.create=async()=>{await Promise.all([loadTL(),loadGL()]);const G=GL.length?GL:DEF_GAMES;app.innerHTML=`<h1>Create Tournament</h1><div class="card"><form data-f="tsave" id="tform"><input type="hidden" name="id"><div class="cols"><div><label>Title</label><input name="title" required maxlength="60"></div><div><label>Game</label><select name="game" required>${G.map(g=>`<option>${esc(g.name)}</option>`).join('')}</select></div><div><label>Mode</label><select name="mode"><option>Solo</option><option>Duo</option><option>Squad</option></select></div><div><label>Map</label><input name="map"></div><div><label>Tournament type</label><select name="type"><option value="free">Free (Coin entry)</option><option value="paid">Paid (Money entry)</option></select></div><div><label>Free: entry fee in Coins</label><input name="ngFee" type="number" min="0" value="0"></div><div><label>Paid: entry fee in Money</label><input name="fee" type="number" min="0" value="0"></div><div><label>Prize pool (Coins if free, Money if paid)</label><input name="prize" type="number" min="0" value="0" required></div><div><label>Total slots</label><input name="slots" type="number" min="1" value="100" required></div><div><label>Start time</label><input name="start" type="datetime-local" required></div><div><label>Status</label><select name="status"><option>upcoming</option><option>live</option><option>completed</option></select></div><div><label>Room ID</label><input name="roomId"></div><div><label>Room password</label><input name="roomPass"></div></div><label>Rules</label><textarea name="rules" rows="4"></textarea><label>Prize distribution (e.g. 1st ₹500, 2nd ₹300)</label><textarea name="pd" rows="3"></textarea><button class="btn" type="submit">Save tournament</button><button class="btn ghost" type="button" data-a="treset">Clear form</button></form></div><h2>All tournaments</h2>${tbl(['Tournament','Game','Slots','Start','Status','Actions'],TL.map(t=>[esc(t.title),esc(t.game),`${t.filled||0}/${t.slots}`,fmt(t.startTime),`<span class="badge ${esc(t.status)}">${esc(t.status)}</span>`,`<button class="btn ghost" data-a="tedit" data-id="${t.id}">Edit</button><button class="btn green" data-a="tstat" data-id="${t.id}" data-s="live">Live</button><button class="btn ghost" data-a="tstat" data-id="${t.id}" data-s="completed">Complete</button><button class="btn red" data-a="tdel" data-id="${t.id}">Delete</button>`]))}`};
H.tsave=async f=>{const v=fd(f);busy(f,true);try{const start=new Date(v.start).getTime();if(!start)throw new Error('Select start time');if(v.type==='paid'&&!(Number(v.fee)>0))throw new Error('Paid tournament needs a Money entry fee');const data={title:v.title.trim(),game:v.game,mode:v.mode.trim(),map:v.map.trim(),type:v.type,ngFee:v.type==='free'?(Number(v.ngFee)||0):0,entryFee:v.type==='paid'?(Number(v.fee)||0):0,prizePool:Number(v.prize)||0,slots:Number(v.slots)||1,startTime:start,status:v.status,rules:v.rules,prizeDetails:v.pd};let ref;if(v.id){ref=db.collection('tournaments').doc(v.id);const cur=(await ref.get()).data();if(data.slots<(cur.filled||0))throw new Error('Slots cannot be less than approved players ('+(cur.filled||0)+')');await ref.update(data)}else{ref=db.collection('tournaments').doc();await ref.set({...data,filled:0,createdAt:Date.now()});await notify('all','New tournament: '+data.title,`${data.game} • Prize ${rs(data.prizePool)} • Register now!`)}
await ref.collection('secret').doc('room').set({roomId:v.roomId.trim(),roomPass:v.roomPass.trim(),updatedAt:Date.now()});toast('Tournament saved');route()}catch(e){toast(fe(e),1);busy(f,false)}};
ACT.treset=()=>route();
ACT.tedit=async d=>{const t=TL.find(x=>x.id===d.id),f=$('#tform'),e=f.elements;e.id.value=t.id;e.title.value=t.title;e.game.value=t.game;e.mode.value=t.mode||'';e.map.value=t.map||'';e.fee.value=t.entryFee||0;e.type.value=t.type||(t.entryFee>0?'paid':'free');e.ngFee.value=t.ngFee||0;e.prize.value=t.prizePool||0;e.slots.value=t.slots;e.start.value=toLocal(t.startTime);e.status.value=t.status;e.rules.value=t.rules||'';e.pd.value=t.prizeDetails||'';e.roomId.value='';e.roomPass.value='';try{const r=await db.collection('tournaments').doc(t.id).collection('secret').doc('room').get();if(r.exists){e.roomId.value=r.data().roomId||'';e.roomPass.value=r.data().roomPass||''}}catch(x){}f.scrollIntoView({behavior:'smooth'});toast('Editing: '+t.title)};
ACT.tstat=async d=>{try{await db.collection('tournaments').doc(d.id).update({status:d.s});if(d.s==='live'){const t=TL.find(x=>x.id===d.id);await notify('all','Live now: '+t.title,'Check room details on the tournament page.')}toast('Status updated');route()}catch(e){toast(fe(e),1)}};
ACT.tdel=async d=>{if(!confirm('Delete this tournament? Existing registrations stay in the database.'))return;try{const r=db.collection('tournaments').doc(d.id);await r.collection('secret').doc('room').delete();await r.delete();toast('Deleted');route()}catch(e){toast(fe(e),1)}};

/* ---------- registrations ---------- */
R.regs=async()=>{await loadTL();await drawRegs()};
async function drawRegs(){let q=db.collection('registrations');q=rt?q.where('tid','==',rt):q.orderBy('createdAt','desc').limit(300);RG=docs(await q.get()).sort((a,b)=>b.createdAt-a.createdAt);const l=rf==='all'?RG:RG.filter(x=>x.status===rf);
app.innerHTML=`<h1>Manage Registrations</h1><div class="cols">${tsel('data-c="regt"',rt,1)}<select data-c="regf">${['all','pending','approved','rejected'].map(s=>`<option ${s===rf?'selected':''}>${s}</option>`).join('')}</select></div>${tbl(['Player','In-game','Tournament','Amount / UTR','Status','Actions'],l.map(x=>[esc(x.name),`${esc(x.ign)}<br><span class="muted">${esc(x.gid)}</span>`,esc(x.tTitle),`${x.payMethod==='nc'?x.amount+' Money':x.payMethod==='gold'?x.ngFee+' Coins':x.payMethod==='free'?'Free':rs(x.amount)}<br><span class="muted">${esc(x.utr||'')}</span>`,`<span class="badge ${esc(x.status)}">${esc(x.status)}</span>`,(x.status!=='approved'?`<button class="btn green" data-a="rapp" data-id="${x.id}">Approve</button>`:'')+(x.status!=='rejected'?`<button class="btn red" data-a="rrej" data-id="${x.id}">Reject</button>`:'')]))}`}
CH.regt=async v=>{rt=v;try{await drawRegs()}catch(e){toast(fe(e),1)}};
CH.regf=async v=>{rf=v;try{await drawRegs()}catch(e){toast(fe(e),1)}};
ACT.rapp=async d=>{const g=RG.find(x=>x.id===d.id);try{await db.runTransaction(async tx=>{const rr=db.collection('registrations').doc(g.id),tr=db.collection('tournaments').doc(g.tid);const [r,t]=await Promise.all([tx.get(rr),tx.get(tr)]);if(r.data().status==='approved')throw new Error('Already approved');if(!t.exists)throw new Error('Tournament not found');const td=t.data();if((td.filled||0)>=td.slots)throw new Error('No slots left');tx.update(tr,{filled:(td.filled||0)+1});tx.update(rr,{status:'approved',reason:'',approvedAt:Date.now()})});await notify(g.uid,'Registration approved','You are in: '+g.tTitle+'. Room details will appear on the tournament page.');toast('Approved');await drawRegs()}catch(e){toast(fe(e),1)}};
ACT.rrej=async d=>{const g=RG.find(x=>x.id===d.id),reason=prompt('Reason for rejection (shown to player)','Payment not verified');if(reason===null)return;try{await db.runTransaction(async tx=>{const rr=db.collection('registrations').doc(g.id),tr=db.collection('tournaments').doc(g.tid);const [r,t]=await Promise.all([tx.get(rr),tx.get(tr)]);if(r.data().status==='approved'&&t.exists)tx.update(tr,{filled:Math.max(0,(t.data().filled||0)-1)});const g0=r.data(),pm=g0.payMethod;if(g0.status==='approved'&&(pm==='gold'||pm==='nc')){const cn=pm==='nc'?'NC':'NG',am=pm==='nc'?g0.amount:g0.ngFee;if(am>0){tx.update(db.collection('users').doc(g0.uid),{[pm==='nc'?'wallet':'gold']:FV.increment(am)});tx.set(db.collection('coinTx').doc(),{uid:g0.uid,coin:cn,type:'refund',amount:am,reason:'Refund - '+g0.tTitle,ref:g0.tid,by:user.uid,createdAt:FV.serverTimestamp()})}}tx.update(rr,{status:'rejected',reason:reason.trim()})});await notify(g.uid,'Registration rejected',g.tTitle+': '+(reason||'Payment not verified'));toast('Rejected');await drawRegs()}catch(e){toast(fe(e),1)}};

var DP=[];
R.deposits=async()=>{DP=docs(await db.collection('deposits').orderBy('createdAt','desc').limit(200).get());const c={};DP.forEach(x=>c[x.utr]=(c[x.utr]||0)+1);app.innerHTML=`<h1>Manage Deposits</h1><div class="stats"><div class="stat"><b>${DP.filter(x=>x.status==='pending').length}</b>Pending</div><div class="stat"><b>${rs(DP.filter(x=>x.status==='approved').reduce((a,x)=>a+x.amount,0))}</b>Approved total</div></div>${tbl(['Date','Player','Amount','UTR','Status','Actions'],DP.map(x=>[fmt(x.createdAt),esc(x.name),rs(x.amount),esc(x.utr)+(c[x.utr]>1?' <span class="badge rejected">duplicate UTR</span>':''),`<span class="badge ${esc(x.status)}">${esc(x.status)}</span>`,x.status==='pending'?`<button class="btn green" data-a="dapp" data-id="${x.id}">Approve</button><button class="btn red" data-a="drej" data-id="${x.id}">Reject</button>`:'']))}`};
ACT.dapp=async d=>{const x=DP.find(y=>y.id===d.id);if(!confirm(`Confirm you received ${rs(x.amount)} (UTR ${x.utr}) in your UPI account?`))return;try{await db.runTransaction(async tx=>{const dr=db.collection('deposits').doc(x.id),s=await tx.get(dr);if(s.data().status!=='pending')throw new Error('Already processed');tx.update(dr,{status:'approved',approvedAt:Date.now()});tx.update(db.collection('users').doc(x.uid),{wallet:FV.increment(x.amount)});tx.set(db.collection('coinTx').doc(),{uid:x.uid,coin:'NC',type:'deposit',amount:x.amount,reason:'Deposit UTR '+x.utr,ref:x.id,by:user.uid,createdAt:FV.serverTimestamp()})});await notify(x.uid,'Deposit approved',x.amount+' Money added to your wallet.');toast('Deposit approved');route()}catch(e){toast(fe(e),1)}};
ACT.drej=async d=>{const x=DP.find(y=>y.id===d.id),why=prompt('Reason (shown to player)','Payment not received');if(why===null)return;try{await db.collection('deposits').doc(x.id).update({status:'rejected',reason:why.trim()});await notify(x.uid,'Deposit rejected',rs(x.amount)+': '+(why||'Payment not received'));route()}catch(e){toast(fe(e),1)}};

/* ---------- coin management ---------- */
var CS={dailyLogin:10,referralBonus:50,participationBonus:5,ncEnabled:false,maxGold:0,expiryDays:0},CT='settings',CUL=[],CQ='',CHF='all';
const CN={NG:'Coins',NC:'Money'};
const tms=x=>x&&x.toMillis?x.toMillis():(x||0);
async function loadCS(){const c=await db.collection('settings').doc('coins').get();if(c.exists)CS={...CS,...c.data()};return CS}
function coinOps(b,uid,coin,amt,type,reason,ref){b.update(db.collection('users').doc(uid),{[coin==='NC'?'wallet':'gold']:FV.increment(amt)});b.set(db.collection('coinTx').doc(),{uid,coin,type,amount:amt,reason:reason||'',ref:ref||'',by:user.uid,createdAt:FV.serverTimestamp()})}
async function chunked(items,per,fn){for(let i=0;i<items.length;i+=per){const b=db.batch();items.slice(i,i+per).forEach(x=>fn(b,x));await b.commit()}}
R.coins=async()=>{await loadCS();CUL=docs(await db.collection('users').orderBy('createdAt','desc').limit(1000).get());await drawCoins()};
ACT.ctab=async d=>{CT=d.t;try{await drawCoins()}catch(e){toast(fe(e),1)}};
const ubtn=u=>`<button class="btn ${u.frozen?'green':'red'}" data-a="cfreeze" data-id="${u.id}">${u.frozen?'Unfreeze coins':'Freeze coins'}</button>`;
function balTbl(){const q=CQ.toLowerCase();return tbl(['Player','Coins','Money','Status','Action'],[...CUL].filter(u=>[u.name,u.username,u.email].join(' ').toLowerCase().includes(q)).sort((a,b)=>(b.gold||0)-(a.gold||0)).map(u=>[esc(u.name)+'<br><span class="muted">@'+esc(u.username)+'</span>',u.gold||0,u.wallet||0,u.frozen?'<span class="badge banned">frozen</span>':'ok',ubtn(u)]))}
CH.csearch=v=>{CQ=v;const e=$('#ctbl');if(e)e.innerHTML=balTbl()};
async function drawCoins(){const tabs=[['settings','Settings'],['give','Give / Deduct'],['bulk','Bonus to all'],['promo','Promo codes'],['balances','Player balances'],['history','Transactions'],['suspicious','Suspicious'],['expiry','Expiry']];
let h=`<h1>Coin Management</h1><div class="tabs">${tabs.map(([k,l])=>`<button class="${CT===k?'on':''}" data-a="ctab" data-t="${k}">${l}</button>`).join('')}</div>`;
const num=(n,l,v,m)=>`<div><label>${l}</label><input name="${n}" type="number" min="0" value="${v||0}" ${m||''}></div>`;
if(CT==='settings')h+=`<div class="card"><form data-f="cset"><div class="cols">${num('dailyLogin','Daily login bonus (Coins)',CS.dailyLogin)}${num('referralBonus','Referral bonus (Coins to referrer)',CS.referralBonus)}${num('participationBonus','Participation bonus (Coins per tournament)',CS.participationBonus)}${num('maxGold','Max Coin balance per player (0 = no limit)',CS.maxGold)}${num('expiryDays','Coin expiry in days (0 = never)',CS.expiryDays)}<div><label>Money (paid tournaments)</label><select name="ncEnabled"><option value="0" ${CS.ncEnabled?'':'selected'}>Disabled</option><option value="1" ${CS.ncEnabled?'selected':''}>Enabled</option></select></div></div><p class="muted">Enable Money only after you have the required legal approval. While disabled, paid tournaments and Money deposits are blocked on the website. Save these settings once so players can claim rewards.</p><button class="btn" type="submit">Save settings</button></form></div>`;
if(CT==='give')h+=`<div class="card"><form data-f="cgive"><label>Player</label><select name="uid" required>${CUL.map(u=>`<option value="${u.id}">${esc(u.name)} (@${esc(u.username)}) - Coins ${u.gold||0} / Money ${u.wallet||0}</option>`).join('')}</select><div class="cols"><div><label>Action</label><select name="act"><option value="grant">Give coins</option><option value="deduct">Deduct / reverse coins</option></select></div><div><label>Coin</label><select name="coin"><option value="NG">Coins</option><option value="NC">Money</option></select></div>${num('amount','Amount',1,'required min="1"')}</div><label>Reason (shown to player)</label><input name="reason" maxlength="80" required><button class="btn" type="submit">Apply</button></form></div>`;
if(CT==='bulk')h+=`<div class="card"><form data-f="cbulk"><p class="muted">Gives Coins to all ${CUL.filter(u=>!u.banned).length} active players (latest 1000 accounts).</p><div class="cols">${num('amount','Coins per player',10,'required min="1"')}</div><label>Reason / event name</label><input name="reason" maxlength="80" required><button class="btn" type="submit">Send bonus to everyone</button></form></div>`;
if(CT==='promo'){const P=docs(await db.collection('promos').get());h+=`<div class="card"><form data-f="cpromo"><div class="cols"><div><label>Code (A-Z, 0-9)</label><input name="code" required maxlength="20"></div>${num('amount','Coins amount',10,'required min="1"')}<div><label>Expires on (optional)</label><input name="exp" type="date"></div></div><button class="btn" type="submit">Create promo code</button></form><p class="muted">Each player can redeem a code only once.</p></div>`+tbl(['Code','Coins','Expires','Status','Actions'],P.map(p=>[esc(p.id),p.amount,p.expiresAt?fmt(p.expiresAt):'Never',p.active?'<span class="badge approved">active</span>':'<span class="badge rejected">off</span>',`<button class="btn ghost" data-a="ptog" data-id="${p.id}" data-on="${p.active?1:0}">${p.active?'Turn off':'Turn on'}</button><button class="btn red" data-a="pdel" data-id="${p.id}">Delete</button>`]))}
if(CT==='balances')h+=`<input data-i="csearch" placeholder="Search name, username, email" value="${esc(CQ)}"><div id="ctbl">${balTbl()}</div>`;
if(CT==='history'){const X=docs(await db.collection('coinTx').orderBy('createdAt','desc').limit(200).get()),nm={};CUL.forEach(u=>nm[u.id]=u.name);h+=`<select data-c="chf">${[['all','All'],['NG','Coins'],['NC','Money']].map(([c,l])=>`<option value="${c}" ${c===CHF?'selected':''}>${l}</option>`).join('')}</select>`+tbl(['Date','Transaction ID','Player','Coin','Type','Details','Amount'],X.filter(x=>CHF==='all'||x.coin===CHF).map(x=>[fmt(tms(x.createdAt)),'<span class="muted" style="word-break:break-all">'+esc(x.id)+'</span>',esc(nm[x.uid]||x.uid),esc(x.coin),esc(x.type),esc(x.reason),(x.amount>0?'+':'')+x.amount]))}
if(CT==='suspicious'){const pl=docs(await db.collection('players').limit(1000).get());const ph={};CUL.forEach(u=>{if(u.phone)(ph[u.phone]=ph[u.phone]||[]).push(u)});const dup=Object.values(ph).filter(a=>a.length>1);const rf={};pl.forEach(p=>{if(p.referredBy)(rf[p.referredBy]=rf[p.referredBy]||[]).push(p)});const rr=Object.entries(rf).filter(([k,a])=>a.length>=3).map(([k,a])=>{const u=CUL.find(x=>x.id===k);const played=a.filter(x=>(x.matches||0)>0).length;return [u?esc(u.name):esc(k),a.length,played,u?ubtn(u):'']});const top=[...CUL].sort((a,b)=>(b.gold||0)-(a.gold||0)).slice(0,10);
h+=`<h2>Same phone on multiple accounts</h2>`+tbl(['Phone','Accounts'],dup.map(a=>[esc(a[0].phone),a.map(u=>esc(u.name)+' (@'+esc(u.username)+')').join(', ')]))+`<h2>Referrers with 3+ referrals</h2>`+tbl(['Referrer','Referred','Played at least 1 match','Action'],rr)+`<h2>Highest Coin balances</h2>`+tbl(['Player','Coins','Money','Action'],top.map(u=>[esc(u.name),u.gold||0,u.wallet||0,ubtn(u)]))}
if(CT==='expiry')h+=`<div class="card"><p>Current Coin expiry: <b>${CS.expiryDays?CS.expiryDays+' days':'never'}</b> (change in Settings).</p><p class="muted">Running expiry removes earned Coins older than the limit that the player has not already spent (oldest coins are treated as spent first). Every removal is saved in the ledger as type "expire". Safe to run more than once.</p><button class="btn red" data-a="cexp">Run Coin expiry now</button></div>`;
app.innerHTML=h}
CH.chf=v=>{CHF=v;drawCoins().catch(e=>toast(fe(e),1))};
H.cset=async f=>{const v=fd(f);const n=k=>Math.max(0,Math.floor(Number(v[k])||0));const on=v.ncEnabled==='1';if(on&&!CS.ncEnabled&&!confirm('Enable Money and paid tournaments? Do this only after legal approval.'))return;busy(f,true);try{await db.collection('settings').doc('coins').set({dailyLogin:n('dailyLogin'),referralBonus:n('referralBonus'),participationBonus:n('participationBonus'),maxGold:n('maxGold'),expiryDays:n('expiryDays'),ncEnabled:on,updatedAt:Date.now()});await loadCS();toast('Settings saved');await drawCoins()}catch(e){toast(fe(e),1);busy(f,false)}};
H.cgive=async f=>{const v=fd(f);busy(f,true);try{const u=CUL.find(x=>x.id===v.uid),amt=Math.floor(Math.abs(Number(v.amount)));if(!u||!(amt>0))throw new Error('Select player and amount');const fld=v.coin==='NC'?'wallet':'gold',cur=u[fld]||0,sg=v.act==='deduct'?-1:1;if(sg<0&&cur<amt)throw new Error('Player has only '+cur+' '+CN[v.coin]);if(!confirm((sg>0?'Give ':'Deduct ')+amt+' '+CN[v.coin]+' - '+u.name+'?'))throw new Error('Cancelled');const b=db.batch();coinOps(b,u.id,v.coin,sg*amt,sg>0?'admin':'reverse',v.reason);await b.commit();u[fld]=cur+sg*amt;await notify(u.id,sg>0?'Coins received':'Coins deducted',(sg>0?'+':'-')+amt+' '+CN[v.coin]+': '+v.reason);toast('Done');await drawCoins()}catch(e){toast(fe(e),1);busy(f,false)}};
H.cbulk=async f=>{const v=fd(f);busy(f,true);try{const amt=Math.floor(Number(v.amount)),us=CUL.filter(u=>!u.banned);if(!(amt>0))throw new Error('Enter amount');if(!confirm('Send '+amt+' Coins to '+us.length+' players?'))throw new Error('Cancelled');await chunked(us,200,(b,u)=>coinOps(b,u.id,'NG',amt,'bonus',v.reason));us.forEach(u=>u.gold=(u.gold||0)+amt);await notify('all','Bonus: +'+amt+' Coins',v.reason);toast('Bonus sent');await drawCoins()}catch(e){toast(fe(e),1);busy(f,false)}};
H.cpromo=async f=>{const v=fd(f);busy(f,true);try{const code=v.code.trim().toUpperCase().replace(/[^A-Z0-9]/g,'');if(!code)throw new Error('Enter code');const ex=await db.collection('promos').doc(code).get();if(ex.exists)throw new Error('Code already exists');await db.collection('promos').doc(code).set({amount:Math.floor(Number(v.amount)),active:true,expiresAt:v.exp?new Date(v.exp+'T23:59:59').getTime():0,createdAt:Date.now()});toast('Promo created');await drawCoins()}catch(e){toast(fe(e),1);busy(f,false)}};
ACT.ptog=async d=>{try{await db.collection('promos').doc(d.id).update({active:d.on!=='1'});await drawCoins()}catch(e){toast(fe(e),1)}};
ACT.pdel=async d=>{if(!confirm('Delete promo '+d.id+'?'))return;try{await db.collection('promos').doc(d.id).delete();await drawCoins()}catch(e){toast(fe(e),1)}};
ACT.cfreeze=async d=>{const u=CUL.find(x=>x.id===d.id);try{await db.collection('users').doc(u.id).update({frozen:!u.frozen});u.frozen=!u.frozen;toast(u.frozen?'Coins frozen':'Coins unfrozen');await drawCoins()}catch(e){toast(fe(e),1)}};
ACT.cexp=async()=>{try{await loadCS();const days=CS.expiryDays;if(!days)return toast('Set Coin expiry days in Settings first',1);if(!confirm('Run Coin expiry now?'))return;const X=docs(await db.collection('coinTx').where('coin','==','NG').limit(5000).get());const cut=Date.now()-days*86400000,m={};X.forEach(x=>{const o=m[x.uid]||(m[x.uid]={old:0,spent:0,exp:0}),a=x.amount;if(x.type==='expire')o.exp+=-a;else if(a>0){if(tms(x.createdAt)<cut)o.old+=a}else o.spent+=-a});const list=[];Object.entries(m).forEach(([uid,o])=>{const u=CUL.find(z=>z.id===uid);if(!u)return;const n=Math.min(u.gold||0,Math.max(0,o.old-o.spent-o.exp));if(n>0)list.push([uid,n])});await chunked(list,200,(b,[uid,n])=>coinOps(b,uid,'NG',-n,'expire','Expired after '+days+' days'));toast(list.length?'Expired coins for '+list.length+' players':'Nothing to expire');R.coins()}catch(e){toast(fe(e),1)}};

/* ---------- matches ---------- */
R.matches=async()=>{await loadTL();MS=docs(await db.collection('matches').orderBy('time','desc').limit(100).get());app.innerHTML=`<h1>Manage Matches</h1><div class="card"><form data-f="msave"><label>Tournament</label>${tsel('name="tid" required','')}<div class="cols"><div><label>Match title</label><input name="title" required placeholder="Match 1 - Erangel"></div><div><label>Time</label><input name="time" type="datetime-local" required></div><div><label>Map</label><input name="map"></div><div><label>Status</label><select name="status"><option>upcoming</option><option>live</option><option>completed</option></select></div></div><button class="btn" type="submit">Add match</button></form></div>${tbl(['Match','Tournament','Time','Status','Actions'],MS.map(m=>[esc(m.title),esc(m.tName),fmt(m.time),`<span class="badge ${esc(m.status)}">${esc(m.status)}</span>`,`<button class="btn green" data-a="mstat" data-id="${m.id}" data-s="live">Live</button><button class="btn ghost" data-a="mstat" data-id="${m.id}" data-s="completed">Done</button><button class="btn red" data-a="mdel" data-id="${m.id}">Delete</button>`]))}`};
H.msave=async f=>{const v=fd(f);busy(f,true);try{const t=TL.find(x=>x.id===v.tid);if(!t)throw new Error('Select a tournament');const time=new Date(v.time).getTime();if(!time)throw new Error('Select match time');await db.collection('matches').add({tid:t.id,tName:t.title,title:v.title.trim(),time,map:v.map.trim(),status:v.status,createdAt:Date.now()});toast('Match added');route()}catch(e){toast(fe(e),1);busy(f,false)}};
ACT.mstat=async d=>{try{await db.collection('matches').doc(d.id).update({status:d.s});route()}catch(e){toast(fe(e),1)}};
ACT.mdel=async d=>{if(!confirm('Delete match?'))return;try{await db.collection('matches').doc(d.id).delete();route()}catch(e){toast(fe(e),1)}};

/* ---------- results ---------- */
R.results=async()=>{await loadTL();RES={t:null,regs:[]};drawRes()};
function drawRes(){app.innerHTML=`<h1>Update Results</h1><div class="card">${tsel('data-c="rest"',RES.t?RES.t.id:'')}</div>${RES.t?`<p class="muted" style="margin-bottom:10px">Only approved players are listed. Saving again corrects earlier values safely (points and prize are adjusted by the difference).</p><div class="card tw"><table><tr><th>Player</th><th>Rank</th><th>Kills</th><th>Points</th><th>Prize (Coins free / Money paid)</th></tr>${RES.regs.map(r=>`<tr data-rid="${r.id}"><td>${esc(r.name)}<br><span class="muted">${esc(r.ign)}</span></td><td><input class="rk" type="number" min="0" value="${r.rank||''}"></td><td><input class="kl" type="number" min="0" value="${r.kills||''}"></td><td><input class="pt" type="number" value="${r.points||''}"></td><td><input class="pz" type="number" min="0" value="${r.prize||''}"></td></tr>`).join('')||'<tr><td colspan="5" class="muted">No approved players.</td></tr>'}</table></div>${RES.regs.length?`<label><input type="checkbox" id="markdone" checked style="width:auto;margin-right:6px">Mark tournament completed</label><br><button class="btn" data-a="saveres">Save results</button>`:''}`:''}`}
CH.rest=async v=>{if(!v){RES={t:null,regs:[]};return drawRes()}try{const t=TL.find(x=>x.id===v);const s=docs(await db.collection('registrations').where('tid','==',v).where('status','==','approved').get());RES={t,regs:s.sort((a,b)=>(a.rank||999)-(b.rank||999))};drawRes()}catch(e){toast(fe(e),1)}};
ACT.saveres=async(d,btn)=>{const t=RES.t,rows=[...document.querySelectorAll('tr[data-rid]')];if(!rows.length)return;btn.disabled=true;try{await loadCS();const cn=(t.type==='paid'||(!t.type&&t.entryFee>0))?'NC':'NG';const ids=[...new Set(RES.regs.map(r=>r.teamId).filter(Boolean))],ex=new Set();await Promise.all(ids.map(i=>db.collection('teams').doc(i).get().then(s=>{if(s.exists)ex.add(i)})));
let b=db.batch(),n=0;const batches=[];const add=()=>{if(n>=450){batches.push(b);b=db.batch();n=0}n++};
rows.forEach(tr=>{const g=RES.regs.find(x=>x.id===tr.dataset.rid),v=c=>Number(tr.querySelector(c).value)||0;const rank=v('.rk'),kills=v('.kl'),pts=v('.pt'),prize=v('.pz');const dP=pts-(g.points||0),dZ=prize-(g.prize||0),first=!g.resultDone,dW=(rank===1?1:0)-(g.rank===1?1:0);
add();b.update(db.collection('registrations').doc(g.id),{rank,kills,points:pts,prize,resultDone:true});
if(dP||dW||first){add();b.update(db.collection('players').doc(g.uid),{points:FV.increment(dP),wins:FV.increment(dW),matches:FV.increment(first?1:0)})}
if(dZ){add();add();coinOps(b,g.uid,cn,dZ,'prize','Prize - '+t.title,t.id)}if(first&&CS.participationBonus>0){add();add();coinOps(b,g.uid,'NG',CS.participationBonus,'participation','Participation reward - '+t.title,t.id)}
if(dP&&g.teamId&&ex.has(g.teamId)){add();b.update(db.collection('teams').doc(g.teamId),{points:FV.increment(dP)})}
Object.assign(g,{rank,kills,points:pts,prize,resultDone:true})});
if($('#markdone').checked){add();b.update(db.collection('tournaments').doc(t.id),{status:'completed'})}
batches.push(b);for(const x of batches)await x.commit();
rows.forEach(tr=>{const g=RES.regs.find(x=>x.id===tr.dataset.rid);if(g.prize>0)notify(g.uid,'Results published',`${t.title}: Rank ${g.rank}, prize ${g.prize} ${CN[cn]} added to your wallet.`).catch(()=>{})});
toast('Results saved');await loadTL()}catch(e){toast(fe(e),1)}btn.disabled=false};

/* ---------- prizes + withdrawals ---------- */
R.prizes=async()=>{const [p,w]=await Promise.all([db.collection('registrations').where('prize','>',0).get(),db.collection('withdrawals').orderBy('createdAt','desc').limit(200).get()]);const P=docs(p).sort((a,b)=>b.prize-a.prize);WD=docs(w);
app.innerHTML=`<h1>Manage Prizes</h1><div class="stats"><div class="stat"><b>${rs(P.reduce((s,x)=>s+x.prize,0))}</b>Total prizes awarded</div><div class="stat"><b>${rs(WD.filter(x=>x.status==='paid').reduce((s,x)=>s+x.amount,0))}</b>Total paid out</div><div class="stat"><b>${rs(WD.filter(x=>x.status==='pending').reduce((s,x)=>s+x.amount,0))}</b>Pending withdrawals</div></div><h2>Withdrawal requests</h2>${tbl(['Date','Player','Amount','UPI','Status','Actions'],WD.map(x=>[fmt(x.createdAt),esc(x.name),rs(x.amount),esc(x.upi),`<span class="badge ${esc(x.status)}">${esc(x.status)}</span>`,x.status==='pending'?`<button class="btn green" data-a="wpay" data-id="${x.id}">Mark paid</button><button class="btn red" data-a="wrej" data-id="${x.id}">Reject</button>`:''])) }<h2>Prize records</h2>${tbl(['Tournament','Player','Rank','Prize'],P.map(x=>[esc(x.tTitle),esc(x.name),x.rank||'-',rs(x.prize)]))}<p class="muted">To change a prize, open Update Results and save again.</p>`};
ACT.wpay=async d=>{const w=WD.find(x=>x.id===d.id);if(!confirm(`Pay ${rs(w.amount)} to ${w.upi}? Send the UPI payment first, then confirm.`))return;try{await db.runTransaction(async tx=>{const wr=db.collection('withdrawals').doc(w.id),ur=db.collection('users').doc(w.uid);const [ws,us]=await Promise.all([tx.get(wr),tx.get(ur)]);if(ws.data().status!=='pending')throw new Error('Already processed');const bal=us.data().wallet||0;if(bal<w.amount)throw new Error('Player wallet balance is too low');tx.update(ur,{wallet:bal-w.amount});tx.update(wr,{status:'paid',paidAt:Date.now()});tx.set(db.collection('transactions').doc(),{uid:w.uid,type:'withdrawal',amount:-w.amount,note:'Withdrawal to '+w.upi,createdAt:Date.now()})});await notify(w.uid,'Withdrawal paid',rs(w.amount)+' sent to '+w.upi);toast('Marked as paid');route()}catch(e){toast(fe(e),1)}};
ACT.wrej=async d=>{const w=WD.find(x=>x.id===d.id);if(!confirm('Reject this withdrawal?'))return;try{await db.collection('withdrawals').doc(w.id).update({status:'rejected'});await notify(w.uid,'Withdrawal rejected','Your withdrawal request of '+rs(w.amount)+' was rejected. Contact support.');route()}catch(e){toast(fe(e),1)}};

/* ---------- news + announcements ---------- */
R.news=async()=>{const N=docs(await db.collection('news').orderBy('createdAt','desc').limit(100).get());app.innerHTML=`<h1>Manage News</h1><div class="card"><form data-f="nsave"><label>Title</label><input name="title" required maxlength="100"><label>Category</label><select name="category"><option>Gaming News</option><option>Esports Updates</option><option>Announcements</option><option>Blogs</option></select><label>Content</label><textarea name="body" rows="5" required></textarea><button class="btn" type="submit">Publish</button></form></div><div class="card"><h3>Send notification to all players</h3><form data-f="bcast"><label>Title</label><input name="title" required maxlength="80"><label>Message</label><textarea name="body" rows="2" required></textarea><button class="btn" type="submit">Send to everyone</button></form></div>${tbl(['Date','Title','Category','Actions'],N.map(n=>[fmt(n.createdAt),esc(n.title),esc(n.category),`<button class="btn red" data-a="ndel" data-id="${n.id}">Delete</button>`]))}`};
H.nsave=async f=>{const v=fd(f);busy(f,true);try{await db.collection('news').add({title:v.title.trim(),category:v.category,body:v.body,createdAt:Date.now()});toast('Published');route()}catch(e){toast(fe(e),1);busy(f,false)}};
H.bcast=async f=>{const v=fd(f);busy(f,true);try{await notify('all',v.title.trim(),v.body.trim());toast('Notification sent');f.reset()}catch(e){toast(fe(e),1)}busy(f,false)};
ACT.ndel=async d=>{if(!confirm('Delete post?'))return;try{await db.collection('news').doc(d.id).delete();route()}catch(e){toast(fe(e),1)}};

/* ---------- reports ---------- */
R.reports=async()=>{const [t,r,p,m]=await Promise.all([db.collection('tournaments').limit(500).get(),db.collection('registrations').limit(2000).get(),db.collection('players').orderBy('points','desc').limit(10).get(),db.collection('messages').orderBy('createdAt','desc').limit(30).get()]);const T=docs(t),RGs=docs(r),P=docs(p),M=docs(m);
const byT=T.map(x=>{const a=RGs.filter(y=>y.tid===x.id);const ap=a.filter(y=>y.status==='approved');return [esc(x.title),esc(x.game),a.length,ap.length,rs(ap.reduce((s,y)=>s+(y.amount||0),0)),rs(a.reduce((s,y)=>s+(y.prize||0),0))]});
const games={};RGs.filter(x=>x.status==='approved').forEach(x=>{games[x.game]=(games[x.game]||0)+1});
app.innerHTML=`<h1>Reports &amp; Analytics</h1><h2>Tournament performance</h2>${tbl(['Tournament','Game','Registered','Approved','Revenue','Prizes'],byT)}<h2>Approved players per game</h2>${tbl(['Game','Players'],Object.entries(games).map(([k,v])=>[esc(k),v]))}<h2>Top 10 players</h2>${tbl(['#','Player','Points','Wins'],P.map((x,i)=>[i+1,esc(x.name),x.points||0,x.wins||0]))}<h2>Contact messages</h2>${tbl(['Date','Name','Email','Message'],M.map(x=>[fmt(x.createdAt),esc(x.name),esc(x.email),esc(x.msg)]))}`};

/* ---------- settings ---------- */
R.settings=async()=>{const s=(await db.collection('settings').doc('site').get()).data()||{};app.innerHTML=`<h1>Site Settings</h1><div class="card"><form data-f="ssave"><label>UPI ID for entry fees</label><input name="upi" value="${esc(s.upi)}" placeholder="name@bank"><label>UPI account name</label><input name="upiName" value="${esc(s.upiName)}"><label>Community link (WhatsApp / Discord)</label><input name="community" type="url" value="${esc(s.community)}"><label>Support email</label><input name="email" type="email" value="${esc(s.email)}"><button class="btn" type="submit">Save settings</button></form></div>`};
H.ssave=async f=>{const v=fd(f);busy(f,true);try{await db.collection('settings').doc('site').set({upi:v.upi.trim(),upiName:v.upiName.trim(),community:v.community.trim(),email:v.email.trim()});toast('Settings saved')}catch(e){toast(fe(e),1)}busy(f,false)};
</script>
<script>
(function(){
var libs=['app','auth','firestore'];
var bases=['https://www.gstatic.com/firebasejs/10.12.2/firebase-%-compat.js','https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-%-compat.min.js'];
function load(u){return new Promise(function(ok,no){var s=document.createElement('script');s.src=u;s.onload=ok;s.onerror=no;document.head.appendChild(s)})}
function tryBase(i){if(i>=bases.length)return Promise.reject(new Error('fail'));var c=Promise.resolve();libs.forEach(function(l){c=c.then(function(){return load(bases[i].replace('%',l))})});return c.catch(function(){return tryBase(i+1)})}
tryBase(0).then(function(){if(!window.firebase)throw new Error('nofb');var s=document.createElement('script');s.textContent=document.getElementById('mainjs').textContent;document.body.appendChild(s)}).catch(function(){var d=document.createElement('div');d.style.cssText='margin:20px;padding:16px;border:1px solid #ff4d6d;border-radius:10px;background:#3a0f1a;color:#fff;font:15px sans-serif';d.innerHTML='<b>Firebase load nahi hua.</b><br>1) Internet check karo.<br>2) File ko Claude preview / in-app viewer me mat kholo. Chrome browser me hosted https link se kholo (Netlify / Firebase Hosting).<br>3) Ad-blocker ya VPN band karke dekho.';document.body.insertBefore(d,document.body.firstChild)});
})();
</script>
