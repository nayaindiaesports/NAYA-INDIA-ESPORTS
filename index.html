<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NAYA INDIA ESPORTS - Player Panel</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
body{background:#0a0a12;color:#fff;padding-bottom:80px}
.header{background:linear-gradient(135deg,#ff0055,#7a00ff);padding:20px;text-align:center;position:sticky;top:0;z-index:10}
.header h1{font-size:28px;letter-spacing:1px}
.header p{opacity:.9;font-size:13px}
.nav{display:flex;gap:10px;padding:12px;overflow-x:auto}
.nav button{flex:1;min-width:90px;padding:10px;border:none;border-radius:20px;background:#1e1e2e;color:#fff;cursor:pointer}
.nav button.active{background:#ff0055}
.card{background:#1a1a28;margin:12px;border-radius:16px;padding:16px;border:1px solid #2a2a3a}
.card h3{margin-bottom:6px}
.badge{background:#00ff88;color:#000;padding:3px 8px;border-radius:10px;font-size:11px;font-weight:bold}
.badge.live{background:#ff0055;color:#fff}
input,select{width:100%;padding:12px;margin:8px 0;background:#0f0f1a;border:1px solid #333;border-radius:10px;color:#fff}
.btn{width:100%;padding:13px;border:none;border-radius:12px;background:linear-gradient(90deg,#ff0055,#7a00ff);color:#fff;font-weight:bold;font-size:16px;cursor:pointer}
.btn2{background:#00ff88;color:#000}
.price{font-size:22px;color:#00ff88;font-weight:bold}
.flex{display:flex;justify-content:space-between;align-items:center}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:8px;text-align:left;border-bottom:1px solid #333}
.profile-top{text-align:center;padding:20px}
.avatar{width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,#ff0055,#7a00ff);display:flex;align-items:center;justify-content:center;font-size:35px;margin:0 auto 10px}
</style>
</head>
<body>

<div class="header">
  <h1>🇮🇳 NAYA INDIA ESPORTS</h1>
  <p>BGMI • Free Fire • Valorant • CODM</p>
</div>

<div class="nav">
  <button onclick="show('home')" id="b-home" class="active">Home</button>
  <button onclick="show('my')" id="b-my">My Joins</button>
  <button onclick="show('leader')" id="b-leader">Leaderboard</button>
  <button onclick="show('profile')" id="b-profile">Profile</button>
</div>

<!-- HOME -->
<div id="home">
  <div class="card" style="background:linear-gradient(135deg,#1a1a28,#2a0a2a)">
    <h2>🔥 Aaj ke Tournaments</h2>
    <p>Jeeto Real Cash • Daily Rooms</p>
  </div>
  <div id="tournamentList"></div>
</div>

<!-- MY JOINS -->
<div id="my" style="display:none">
  <div class="card"><h2>🎮 Mere Joined Matches</h2><div id="myList"></div></div>
</div>

<!-- LEADERBOARD -->
<div id="leader" style="display:none">
  <div class="card"><h2>🏆 Top Players</h2>
  <table><tr><th>Rank</th><th>Player</th><th>Wins</th><th>Earnings</th></tr><tbody id="leaderBody"></tbody></table>
  </div>
</div>

<!-- PROFILE -->
<div id="profile" style="display:none">
  <div class="card">
    <div class="profile-top">
      <div class="avatar">🎮</div>
      <h2 id="pName">Player</h2>
      <p id="pGame">BGMI ID: -</p>
    </div>
    <input id="regName" placeholder="Apna Naam (IGN)">
    <input id="regGameId" placeholder="BGMI / Free Fire ID">
    <input id="regPhone" placeholder="WhatsApp Number">
    <select id="regGame"><option>BGMI</option><option>Free Fire MAX</option><option>Valorant</option><option>COD Mobile</option></select>
    <button class="btn" onclick="saveProfile()">Profile Save Karo</button>
    <div style="margin-top:15px" class="flex"><span>💰 Wallet Balance</span><b id="wallet" style="color:#00ff88">₹0</b></div>
  </div>
</div>

<script>
let tournaments = JSON.parse(localStorage.getItem('nie_tournaments')||'[]');
if(tournaments.length==0){
  tournaments=[
    {id:1,title:"BGMI Solo - Daily Cash Cup",game:"BGMI",entry:50,prize:1000,perKill:10,slots:100,filled:42,time:"Aaj, 7 PM",status:"LIVE",room:"Room ID match se 10 min pehle milega"},
    {id:2,title:"Free Fire Duo - Naya India Cup",game:"Free Fire MAX",entry:30,prize:600,perKill:5,slots:48,filled:18,time:"Aaj, 9 PM",status:"UPCOMING",room:"-"},
    {id:3,title:"BGMI Squad - Mega Sunday",game:"BGMI",entry:100,prize:5000,perKill:20,slots:25,filled:9,time:"Sunday, 6 PM",status:"UPCOMING",room:"-"},
  ];
  localStorage.setItem('nie_tournaments',JSON.stringify(tournaments));
}
let joins = JSON.parse(localStorage.getItem('nie_joins')||'[]');
let profile = JSON.parse(localStorage.getItem('nie_profile')||'{}');

function show(id){
  ['home','my','leader','profile'].forEach(x=>document.getElementById(x).style.display=x==id?'block':'none');
  document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));
  document.getElementById('b-'+id).classList.add('active');
  render();
}

function render(){
  let html='';
  tournaments.forEach(t=>{
    let joined = joins.find(j=>j==t.id);
    html+=`<div class="card">
      <div class="flex"><h3>${t.title}</h3><span class="badge ${t.status=='LIVE'?'live':''}">${t.status}</span></div>
      <p>🎮 ${t.game} • 🕒 ${t.time}</p>
      <div class="flex" style="margin:10px 0"><span>Entry: <b>₹${t.entry}</b></span><span>Prize: <b style="color:#00ff88">₹${t.prize}</b></span><span>Per Kill: ₹${t.perKill}</span></div>
      <p>Slots: ${t.filled}/${t.slots} • ${Math.round(t.filled/t.slots*100)}% Full</p>
      <div style="background:#333;height:8px;border-radius:10px;margin:8px 0;overflow:hidden"><div style="width:${t.filled/t.slots*100}%;background:#ff0055;height:100%"></div></div>
      <button class="btn ${joined?'btn2':''}" onclick="join(${t.id})">${joined?'✅ Joined - Room Dekho':'JOIN NOW - ₹'+t.entry}</button>
      ${joined?`<p style="margin-top:8px;font-size:13px">🔑 ${t.room}</p>`:''}
    </div>`;
  });
  document.getElementById('tournamentList').innerHTML = html || '<div class="card">Abhi koi tournament nahi hai</div>';

  let myHtml = joins.length? '' : 'Abhi koi match join nahi kiya';
  joins.forEach(id=>{
    let t=tournaments.find(x=>x.id==id);
    if(t) myHtml+=`<div style="padding:10px;border-bottom:1px solid #333"><b>${t.title}</b><br>${t.time} • Entry ₹${t.entry}</div>`;
  });
  document.getElementById('myList').innerHTML=myHtml;

  // Leaderboard dummy + real
  let leaders = JSON.parse(localStorage.getItem('nie_leader')||'[{"name":"RDX Rahul","wins":12,"earn":5400},{"name":"Hunter OP","wins":9,"earn":3200},{"name":"Sniper King","wins":7,"earn":2100}]');
  document.getElementById('leaderBody').innerHTML = leaders.map((l,i)=>`<tr><td>#${i+1}</td><td>${l.name}</td><td>${l.wins}</td><td>₹${l.earn}</td></tr>`).join('');

  document.getElementById('pName').innerText = profile.name||'Player';
  document.getElementById('pGame').innerText = (profile.game||'BGMI')+' ID: '+(profile.gameId||'-');
  document.getElementById('regName').value = profile.name||'';
  document.getElementById('regGameId').value = profile.gameId||'';
  document.getElementById('regPhone').value = profile.phone||'';
  document.getElementById('wallet').innerText = '₹'+(profile.wallet||0);
}

function join(id){
  if(!profile.name){ alert('Pehle Profile me naam bharo!'); show('profile'); return; }
  if(joins.includes(id)){ alert('Already Joined!'); return; }
  if(confirm('Join karna hai? Entry wallet se kategi')){
    joins.push(id);
    localStorage.setItem('nie_joins',JSON.stringify(joins));
    let t=tournaments.find(x=>x.id==id); t.filled++;
    localStorage.setItem('nie_tournaments',JSON.stringify(tournaments));
    render(); alert('✅ Successfully Joined!');
  }
}
function saveProfile(){
  profile={name:document.getElementById('regName').value,gameId:document.getElementById('regGameId').value,phone:document.getElementById('regPhone').value,game:document.getElementById('regGame').value,wallet:profile.wallet||0};
  localStorage.setItem('nie_profile',JSON.stringify(profile));
  alert('Profile Saved!'); render();
}
render();
</script>
</body>
      </html>
