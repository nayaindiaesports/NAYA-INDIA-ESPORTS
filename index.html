R.tournaments=async(a,m)=>{await loadT();a=a||'all';const modes=[['Solo','Play alone and fight for the top spot.'],['Duo','Team up with one partner.'],['Squad','Bring your full squad to win.']];const same=(t,x)=>(t.mode||'').toLowerCase()===x.toLowerCase();const tabs=[['all','All'],['live','Live'],['upcoming','Upcoming'],['completed','Completed']];let l=a==='all'?T:T.filter(t=>t.status===a);if(m)l=l.filter(t=>same(t,m));
app.innerHTML=`<h1>Tournaments</h1><div class="car">${modes.map(([x,d])=>`<div class="card"><span class="badge">${x}</span><h3 style="margin:8px 0">${x.toUpperCase()}</h3><p class="muted">${d}</p><div class="row"><span>Tournaments</span><b>${T.filter(t=>same(t,x)).length}</b></div><div class="row"><span>Registration open</span><b>${T.filter(t=>same(t,x)&&t.status==='upcoming'&&(t.filled||0)<t.slots).length}</b></div><a class="btn" href="#/tournaments/${a}/${x}">View ${x}</a></div>`).join('')}</div><div class="tabs">${tabs.map(([k,n])=>`<a class="${a===k?'on':''}" href="#/tournaments/${k}${m?'/'+m:''}">${n}</a>`).join('')}${m?`<a href="#/tournaments/${a}">✕ ${m}</a>`:''}</div><div class="grid">${l.map(tcard).join('')||'<div class="card muted">No tournaments found.</div>'}</div>`};
R.tournament=async id=>{const d=await db.collection('tournaments').doc(id).get();if(!d.exists){app.innerHTML='<div class="card">Tournament not found.</div>';return}await loadSite();const t={id,...d.data()};D={t,regs:[],ms:[],room:null,mine:null,tab:'overview'};
const jobs=[db.collection('matches').where('tid','==',id).get().then(s=>{D.ms=docs(s).sort((a,b)=>a.time-b.time)})];
if(user){jobs.push(db.collection('registrations').where('tid','==',id).where('status','==','approved').get().then(s=>{D.regs=docs(s)}));jobs.push(db.collection('registrations').where('tid','==',id).where('uid','==',user.uid).get().then(s=>{D.mine=s.empty?null:s.docs[0].data()}))}
await Promise.all(jobs);
if(D.mine&&D.mine.status==='approved'&&t.status!=='completed'){try{const r=await db.collection('tournaments').doc(id).collection('secret').doc('room').get();D.room=r.exists?r.data():null}catch(e){}}
drawT()};
function drawT(){const t=D.t,tabs=[['overview','Overview'],['rules','Rules'],['prize','Prize Pool'],['teams','Teams'],['schedule','Schedule'],['points','Points Table'],['results','Results']];
app.innerHTML=`<a href="#/tournaments">← All tournaments</a><h1 style="margin-top:8px">${esc(t.title)}</h1><span class="badge ${esc(t.status)}">${esc(t.status)}</span><div class="tabs" style="margin-top:12px">${tabs.map(([k,n])=>`<button class="${D.tab===k?'on':''}" data-a="ttab" data-t="${k}">${n}</button>`).join('')}</div><div id="tpanel">${tpanel()}</div>`}
function tpanel(){const t=D.t,k=D.tab,need='<div class="card muted">Login to view this section.</div>';
if(k==='overview'){let h=`<div class="card"><div class="stats"><div class="stat"><b>${esc(t.game)}</b>Game</div><div class="stat"><b>${pz(t)}</b>Prize pool</div><div class="stat"><b>${entryTxt(t)}</b>Entry</div><div class="stat"><b>${t.filled||0}/${t.slots||0}</b>Slots</div></div><p>Mode: ${esc(t.mode||'-')} • Map: ${esc(t.map||'-')}</p><p>Starts: ${fmt(t.startTime)}</p></div>`;
if(D.room)h+=`<div class="room"><b>Room credentials</b><br>Room ID: <b>${esc(D.room.roomId||'-')}</b><br>Password: <b>${esc(D.room.roomPass||'-')}</b></div>`;else if(D.mine&&D.mine.status==='approved'&&t.status!=='completed')h+='<div class="card muted">Room ID and password will appear here when the admin publishes them.</div>';
h+=`<div class="card" id="regbox">${regBlock(t)}</div>`;return h}
if(k==='rules')return `<div class="card" style="white-space:pre-wrap">${esc(t.rules||'Rules will be updated soon. Follow the general Rules & Fair Play page.')}</div>`;
if(k==='prize')return `<div class="card"><h3>Total prize pool: ${pz(t)}</h3><p style="white-space:pre-wrap;margin-top:8px">${esc(t.prizeDetails||'Prize distribution will be announced.')}</p></div>`;
if(!user)return need;
if(k==='teams')return tbl(['#','Player','In-game name','Team'],D.regs.map((r,i)=>[i+1,esc(r.name),esc(r.ign),esc(r.teamName||'-')]));
if(k==='schedule')return tbl(['Match','Time','Map','Status'],D.ms.map(m=>[esc(m.title),fmt(m.time),esc(m.map||'-'),`<span class="badge ${esc(m.status)}">${esc(m.status)}</span>`]));
const done=D.regs.filter(r=>r.resultDone);
if(k==='points')return tbl(['Rank','Player','Kills','Points'],[...done].sort((a,b)=>(a.rank||99)-(b.rank||99)).map(r=>[r.rank||'-',esc(r.name),r.kills||0,r.points||0]));
if(k==='results')return tbl(['Rank','Player','Prize'],done.filter(r=>r.prize>0||r.rank<=3).sort((a,b)=>(a.rank||99)-(b.rank||99)).map(r=>[r.rank||'-',esc(r.name),(r.prize||0)+(r.type==='paid'?' Money':' Coins')]))}
function regBlock(t){if(t.status==='completed')return '<p class="muted">This tournament is completed.</p>';if(!user)return '<a class="btn" href="#/login">Login to register</a>';if(D.mine)return `<p>Your registration: <span class="badge ${esc(D.mine.status)}">${esc(D.mine.status)}</span></p>${D.mine.status==='rejected'?`<p class="muted">Reason: ${esc(D.mine.reason||'Payment not verified')}</p>`:''}${D.mine.status==='pending'?'<p class="muted">Admin will verify your payment soon.</p>':''}`;if((t.filled||0)>=t.slots)return '<p class="muted">All slots are full.</p>';return '<button class="btn" data-a="showreg">Register for this tournament</button>'}
ACT.ttab=d=>{D.tab=d.t;drawT()};
ACT.showreg=async()=>{site._ok=0;await Promise.all([loadMe(),loadSite()]);const t=D.t,paid=ttype(t)==='paid',fee=paid?(Number(t.entryFee)||0):(Number(t.ngFee)||0),coin=paid?'NC':'NG',bal=paid?(me.wallet||0):(me.gold||0);
if(paid&&!coins.ncEnabled){$('#regbox').innerHTML='<p class="muted">🔒 Paid tournaments are not active yet. They open after the required approvals.</p>';return}
const low=fee>0&&bal<fee;const note=fee>0?`<div class="room" style="border-color:var(--neon);color:var(--text)">Entry: <b>${fee} ${CN[coin]}</b> • Your balance: <b>${bal} ${CN[coin]}</b>${low?`<br>Not enough ${CN[coin]}. <a href="#/wallet/${paid?'cash':'gold'}">${paid?'Open Money':'Earn Coins'}</a>`:''}</div>`:'<p class="muted">This tournament is free to join.</p>';

H.treg=async f=>{const v=fd(f),t=D.t;busy(f,true);try{const ex=await db.collection('registrations').where('tid','==',t.id).where('uid','==',user.uid).get();if(!ex.empty)throw new Error('You are already registered');site._ok=0;await Promise.all([loadSite(),loadMe()]);const ft=(await db.collection('tournaments').doc(t.id).get()).data();if((ft.filled||0)>=ft.slots)throw new Error('Slots are full');if(ft.status==='completed')throw new Error('Tournament is completed');if(!ft.type)throw new Error('This tournament is not ready yet (admin must re-save it once).');const paid=ft.type==='paid';if(paid&&!coins.ncEnabled)throw new Error('Paid tournaments are not active yet');const fee=paid?(Number(ft.entryFee)||0):(Number(ft.ngFee)||0),coin=paid?'NC':'NG',fld=paid?'wallet':'gold',rid=t.id+'_'+user.uid;if(fee>0&&(me[fld]||0)<fee)throw new Error('Not enough '+CN[coin]+' balance');
const b=db.batch();b.set(db.collection('registrations').doc(rid),{tid:t.id,tTitle:t.title,game:t.game,uid:user.uid,name:me.name,ign:v.ign.trim(),gid:v.gid.trim(),teamName:(v.team||'').trim(),teamId:me.teamId||'',amount:paid?fee:0,ngFee:paid?0:fee,payMethod:paid?'nc':(fee>0?'gold':'free'),type:ft.type,utr:'',status:'approved',approvedAt:Date.now(),createdAt:Date.now()});
if(fee>0){const xid='entry_'+rid;b.set(db.collection('coinTx').doc(xid),{uid:user.uid,coin,type:'entry',amount:-fee,reason:'Entry - '+t.title,ref:t.id,by:'system',createdAt:FV.serverTimestamp()});b.update(db.collection('users').doc(user.uid),{[fld]:FV.increment(-fee),lastTx:xid})}
b.update(db.collection('tournaments').doc(t.id),{filled:(ft.filled||0)+1});await b.commit();await loadMe();updateNav();toast(fee>0?'Joined. '+fee+' '+CN[coin]+' deducted.':'Joined successfully.');await R.tournament(t.id)}catch(e){toast(fe(e),1);busy(f,false)}};

H.invite=async f=>{const u=fd(f).u.trim().toLowerCase().replace('@','');busy(f,true);try{const p=await db.collection('players').where('username','==',u).limit(1).get();if(p.empty)throw new Error('No player with that username');const pl=p.docs[0],t=(await db.collection('teams').doc(me.teamId).get()).data();if(pl.id===user.uid)throw new Error('You are already in your team');if(pl.data().teamId)throw new Error('Player is already in a team');if((t.members||[]).length>=5)throw new Error('Team is full (max 5)');await db.collection('invites').doc(me.teamId+'_'+pl.id).set({teamId:me.teamId,teamName:t.name,toUid:pl.id,toName:pl.data().name,from:user.uid,status:'pending',createdAt:Date.now()});toast('Invite sent to @'+u);f.reset()}catch(e){toast(fe(e),1)}busy(f,false)};

ACT.clearteam=async()=>{try{const b=db.batch();b.update(db.collection('users').doc(user.uid),{teamId:''});b.update(db.collection('players').doc(user.uid),{teamId:''});await b.commit();await loadMe();route()}catch(e){toast(fe(e),1)}};
ACT.leave=async()=>{try{const ref=db.collection('teams').doc(me.teamId),t=(await ref.get()).data(),cap=t.captain===user.uid;if(cap&&t.members.length>1)return toast('Captain can disband only when all other members have left',1);if(!confirm(cap?'Disband this team?':'Leave this team?'))return;const b=db.batch();if(cap)b.delete(ref);else b.update(ref,{members:FV.arrayRemove(user.uid),memberNames:FV.arrayRemove(me.name)});b.update(db.collection('users').doc(user.uid),{teamId:''});b.update(db.collection('players').doc(user.uid),{teamId:''});await b.commit();await loadMe();toast('Done');go('#/teams/explore')}catch(e){toast(fe(e),1)}};

async function claim(id,data,extra){await loadMe();const b=db.batch();b.set(db.collection('coinTx').doc(id),{uid:user.uid,coin:'NG',by:'system',ref:'',reason:'',createdAt:FV.serverTimestamp(),...data});b.update(db.collection('users').doc(user.uid),{gold:FV.increment(data.amount),lastTx:id,...(extra||{})});try{await b.commit()}catch(e){throw e.code==='permission-denied'?new Error('Not available: already claimed, limit reached, frozen or reward inactive'):e}await loadMe();updateNav()}
ACT.daily=async()=>{try{site._ok=0;await loadSite();const day=utcDay(),amt=Number(coins.dailyLogin)||0;if(!(amt>0))throw new Error('Daily reward is not active');await loadMe();if(me.lastDaily===day)throw new Error('Already claimed today');await claim('login_'+user.uid+'_'+day,{type:'daily',amount:amt,reason:'Daily login reward'},{lastDaily:day});toast('+'+amt+' Coins added');route()}catch(e){toast(fe(e),1)}};

R.wallet=async a=>{if(!user)return needLogin();a=a==='cash'?'cash':'gold';site._ok=0;await Promise.all([loadMe(),loadSite()]);const nc=a==='cash',coin=nc?'NC':'NG';
const tx=docs(await db.collection('coinTx').where('uid','==',user.uid).where('coin','==',coin).get()).map(x=>({...x,t:tms(x.createdAt)})).sort((x,y)=>y.t-x.t);
const earn=tx.filter(x=>x.amount>0),spend=tx.filter(x=>x.amount<0),bal=nc?(me.wallet||0):(me.gold||0);
const rows=l=>tbl(['Date &amp; time','Transaction ID','Type','Details','Coins'],l.map(x=>[fmt(x.t),'<span class="muted" style="word-break:break-all">'+esc(x.id)+'</span>',esc(x.type),esc(x.reason||'-'),(x.amount>0?'+':'')+x.amount]));
let h=acct('wallet')+`<div class="tabs"><a class="${nc?'':'on'}" href="#/wallet/gold">🟡 Coin</a><a class="${nc?'on':''}" href="#/wallet/cash">🔵 Money</a></div><div class="card"><div class="stats"><div class="stat"><b>${bal}</b>${CN[coin]} balance</div><div class="stat"><b>${earn.reduce((s,x)=>s+x.amount,0)}</b>Total earned</div><div class="stat"><b>${-spend.reduce((s,x)=>s+x.amount,0)}</b>Total spent</div></div>`;
if(!nc){h+=`<p class="muted">Coins are free. Use them only to join free tournaments. Coins have no cash value, cannot be withdrawn and cannot be transferred to other players.</p></div>`;
h+=`<div class="card"><h3>Earn Coins</h3>`+(coins.dailyLogin>0?(me.lastDaily===utcDay()?'<p class="muted">🎁 Daily reward claimed today (resets at 5:30 AM IST).</p>':`<p>🎁 Daily login reward: <b>+${coins.dailyLogin} Coins</b></p><button class="btn" data-a="daily">Claim daily reward</button>`):'')+`<h3 style="margin-top:14px">Promo code</h3><form data-f="promo"><input name="code" placeholder="ENTER CODE" maxlength="20" style="text-transform:uppercase"><button class="btn" type="submit">Redeem</button></form><p class="muted">Participation bonus: +${coins.participationBonus||0} Coins for every tournament you play. Admin bonuses and event rewards are added automatically.</p></div>`;
const refs=docs(await db.collection('players').where('referredBy','==',user.uid).get());
h+=`<div class="card"><h3>Refer &amp; earn</h3><p class="muted">Share your link. You get <b>${coins.referralBonus||0} Coins</b> for each friend after they play their first tournament.</p><input readonly onclick="this.select()" value="${esc(location.origin+location.pathname+'#/register/'+me.username)}">${refs.length?tbl(['Friend','Matches','Reward'],refs.map(p=>{const done=tx.find(x=>x.id==='ref_'+user.uid+'_'+p.id);return [esc(p.name),p.matches||0,done?'Claimed ✓':((p.matches||0)>=1?`<button class="btn" data-a="refclaim" data-id="${p.id}" data-n="${esc(p.name)}">Claim</button>`:'<span class="muted">After first match</span>')]})):'<p class="muted">No referrals yet.</p>'}</div>`;
const BON=['daily','referral','promo','participation','admin','bonus'];
h+=`<h2>Bonus received</h2>`+rows(earn.filter(x=>BON.includes(x.type)))+`<h2>Earning history</h2>`+rows(earn)+`<h2>Spending history</h2>`+rows(spend)}
else{if(!coins.ncEnabled){h+=`<p class="muted">🔒 Money is not active yet. It will open after the required approvals. Money cannot be exchanged with Coins and is not automatically withdrawable.</p></div>`}
else{const dps=docs(await db.collection('deposits').where('uid','==',user.uid).get()).sort((x,y)=>y.createdAt-x.createdAt);h+=`<p class="muted">Money is used only for paid tournaments. It cannot be exchanged with Coins. 1 Money = ₹1.</p></div><div class="card"><h3>Add Money</h3><form data-f="deposit"><label>Amount (10 - 50,000 Money)</label><input name="amount" data-i="depamt" type="number" min="10" max="50000" required><div class="room" style="border-color:var(--neon);color:var(--text)">Pay to UPI: <b>${esc(site.upi||'UPI ID not set by admin')}</b><br><a class="btn ghost" id="deplink" style="display:none" href="#/wallet/cash">Pay with UPI app</a></div><label>UPI transaction / UTR ID (after payment)</label><input name="utr" required minlength="6" maxlength="30"><button class="btn" type="submit">Submit request</button></form><p class="muted">Money is added after the admin verifies your payment.</p></div><h2>Requests</h2>`+tbl(['Date','Amount','UTR','Status'],dps.map(x=>[fmt(x.createdAt),x.amount+' Money',esc(x.utr),`<span class="badge ${esc(x.status)}">${esc(x.status)}</span>`+(x.status==='rejected'&&x.reason?'<br><span class="muted">'+esc(x.reason)+'</span>':'')]))}
h+=`<h2>Earning history</h2>`+rows(earn)+`<h2>Spending history</h2>`+rows(spend)}
app.innerHTML=h};
CH.depamt=v=>{const a=Number(v),l=$('#deplink');if(!l||!site.upi)return;if(a>=10){l.href='upi://pay?pa='+encodeURIComponent(site.upi)+'&pn='+encodeURIComponent(site.upiName||'NAYA INDIA ESPORTS')+'&am='+a+'&cu=INR&tn='+encodeURIComponent('Add Money');l.style.display='inline-block'}else l.style.display='none'};

/* ---------- app install (PWA) ---------- */
let instHidden=false;
function isApp(){return matchMedia('(display-mode: standalone)').matches||navigator.standalone===true}
function showInst(){const b=$('#inst');if(b)b.style.display=(window.deferredPrompt&&!isApp()&&!instHidden)?'flex':'none'}
async function doInstall(){const p=window.deferredPrompt;if(isApp())return toast('App is already installed');if(!p)return toast('Chrome menu (3 dots) > Install app / Add to Home screen',1);p.prompt();try{await p.userChoice}catch(e){}window.deferredPrompt=null;showInst()}
ACT.install=doInstall;
$('#instgo').onclick=doInstall;$('#instx').onclick=()=>{instHidden=true;showInst()};
window.addEventListener('pwa-ready',showInst);
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
<script>
(function(){
var libs=['app','auth','firestore'];
var bases=['https://www.gstatic.com/firebasejs/10.12.2/firebase-%-compat.js','https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-%-compat.min.js'];
function load(u){return new Promise(function(ok,no){var s=document.createElement('script');s.src=u;s.onload=ok;s.onerror=no;document.head.appendChild(s)})}
function tryBase(i){if(i>=bases.length)return Promise.reject(new Error('fail'));var c=Promise.resolve();libs.forEach(function(l){c=c.then(function(){return load(bases[i].replace('%',l))})});return c.catch(function(){return tryBase(i+1)})}
tryBase(0).then(function(){if(!window.firebase)throw new Error('nofb');var s=document.createElement('script');s.textContent=document.getElementById('mainjs').textContent;document.body.appendChild(s)}).catch(function(){var d=document.createElement('div');d.style.cssText='margin:20px;padding:16px;border:1px solid #ff4d6d;border-radius:10px;background:#3a0f1a;color:#fff;font:15px sans-serif';d.innerHTML='<b>Firebase load nahi hua.</b><br>1) Internet check karo.<br>2) File ko Claude preview / in-app viewer me mat kholo. Chrome browser me hosted https link se kholo (Netlify / Firebase Hosting).<br>3) Ad-blocker ya VPN band karke dekho.';document.body.insertBefore(d,document.body.firstChild)});
})();
</script>
